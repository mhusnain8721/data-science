name: FlatBuffers vector doctest validation
on:
  push:
    branches:
      - validation/flatbuffers-vector-doctests-20260910
permissions:
  contents: read
concurrency:
  group: flatbuffers-vector-doctest-validation
  cancel-in-progress: true
jobs:
  doctests:
    name: doctests (${{ matrix.toolchain }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable, 1.56.0]
    steps:
      - name: Validate exact PR patch and doctests
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "${{ matrix.toolchain }}" --profile minimal
          rustc "+${{ matrix.toolchain }}" --version
          cargo "+${{ matrix.toolchain }}" --version

          git init flatbuffers
          cd flatbuffers
          git remote add origin https://github.com/google/flatbuffers.git
          git fetch --depth=1 origin 5761d6e67af841d15ee21bc1ce9a78ffa9cf939e
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "5761d6e67af841d15ee21bc1ce9a78ffa9cf939e"
          test "$(git hash-object rust/flatbuffers/src/vector.rs)" = "17a3a1698ed1c024074ee61adec5089676c8e201"

          curl -fsSL \
            https://raw.githubusercontent.com/mhusnain8721/data-science/55c1f819f6898f8ba3979e5db9f51271e96fa1f6/contributions/flatbuffers/flatbuffers-rust-unsafe-contract-doctests.patch \
            -o "$RUNNER_TEMP/vector-doctests.patch"
          echo "2a8c6f157225de6d5a58eb9762de8e4db99366cdfeb915e168a518da7a8a193e  $RUNNER_TEMP/vector-doctests.patch" | sha256sum -c -
          git apply --check "$RUNNER_TEMP/vector-doctests.patch"
          git apply "$RUNNER_TEMP/vector-doctests.patch"
          git diff --check
          test "$(git hash-object rust/flatbuffers/src/vector.rs)" = "075fa6e95cc7cb9065369c355f6f4e871ee455b2"

          CARGO_TARGET_DIR="$RUNNER_TEMP/flatbuffers-std-${{ matrix.toolchain }}" \
            cargo "+${{ matrix.toolchain }}" test --manifest-path rust/flatbuffers/Cargo.toml --doc
          CARGO_TARGET_DIR="$RUNNER_TEMP/flatbuffers-no-std-${{ matrix.toolchain }}" \
            cargo "+${{ matrix.toolchain }}" test --manifest-path rust/flatbuffers/Cargo.toml --doc --no-default-features

  explicit-e0133:
    name: explicit E0133 checks (stable)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Verify negative examples fail only for unsafe-call requirement
        shell: bash
        run: |
          set -euo pipefail
          git init flatbuffers
          cd flatbuffers
          git remote add origin https://github.com/google/flatbuffers.git
          git fetch --depth=1 origin 5761d6e67af841d15ee21bc1ce9a78ffa9cf939e
          git checkout --detach FETCH_HEAD
          curl -fsSL \
            https://raw.githubusercontent.com/mhusnain8721/data-science/55c1f819f6898f8ba3979e5db9f51271e96fa1f6/contributions/flatbuffers/flatbuffers-rust-unsafe-contract-doctests.patch \
            -o "$RUNNER_TEMP/vector-doctests.patch"
          echo "2a8c6f157225de6d5a58eb9762de8e4db99366cdfeb915e168a518da7a8a193e  $RUNNER_TEMP/vector-doctests.patch" | sha256sum -c -
          git apply "$RUNNER_TEMP/vector-doctests.patch"
          CARGO_TARGET_DIR="$RUNNER_TEMP/flatbuffers-std" cargo test --manifest-path rust/flatbuffers/Cargo.toml --doc
          CARGO_TARGET_DIR="$RUNNER_TEMP/flatbuffers-no_std" cargo test --manifest-path rust/flatbuffers/Cargo.toml --doc --no-default-features

          cat > "$RUNNER_TEMP/verify-examples.py" <<'PY'
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          source = Path("rust/flatbuffers/src/vector.rs").read_text()
          pattern = re.compile(r"^[ \t]*/// ```([^\n]*)\n(.*?)^[ \t]*/// ```[ \t]*$", re.M | re.S)
          examples = []
          for match in pattern.finditer(source):
              code = "\n".join(re.sub(r"^[ \t]*/// ?", "", line) for line in match[2].splitlines())
              examples.append(("compile_fail" in match[1], code))
          assert len(examples) == 6
          assert sum(negative for negative, _ in examples) == 3

          results = []
          for mode in ("std", "no_std"):
              deps = Path(os.environ["RUNNER_TEMP"]) / f"flatbuffers-{mode}" / "debug/deps"
              libraries = list(deps.glob("libflatbuffers-*.rlib"))
              assert len(libraries) == 1, libraries
              dest = Path(os.environ["RUNNER_TEMP"]) / f"examples-{mode}"
              dest.mkdir()
              for index, (negative, code) in enumerate(examples):
                  src = dest / f"example_{index}.rs"
                  exe = dest / f"example_{index}"
                  src.write_text("fn main() {\n" + code + "\n}\n")
                  command = ["rustc", "--edition=2018", "--error-format=json", str(src),
                             "--extern", f"flatbuffers={libraries[0]}",
                             "-L", f"dependency={deps}", "-o", str(exe)]
                  completed = subprocess.run(command, text=True, capture_output=True, timeout=60)
                  diagnostics = []
                  for line in completed.stderr.splitlines():
                      try:
                          diagnostics.append(json.loads(line))
                      except json.JSONDecodeError:
                          pass
                  codes = {d["code"]["code"] for d in diagnostics
                           if d.get("level") == "error" and d.get("code")}
                  if negative:
                      assert completed.returncode != 0 and codes == {"E0133"}, completed.stderr
                  else:
                      assert completed.returncode == 0, completed.stderr
                      subprocess.run([str(exe)], check=True, timeout=10)
                  results.append((mode, index, negative, sorted(codes)))
          print(results)
          assert len(results) == 12
          PY
          python3 "$RUNNER_TEMP/verify-examples.py"
